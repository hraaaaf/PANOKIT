name: J04 Drizzle artifact preparation (TEMPORARY, no deploy)
on:
  push:
    branches: [feat/j04-d1b-drizzle-20261114]
permissions:
  contents: read
jobs:
  generate:
    if: github.repository == 'hraaaaf/PANOKIT'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.22.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Generate lockfile from exact pinned dependencies
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Install from the newly generated lockfile
        run: pnpm install --frozen-lockfile
      - name: Generate Drizzle SQL and snapshots
        run: pnpm --filter @panokit/api db:generate
      - name: Publish text artifacts to CI logs for a checked commit
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(pnpm-lock.yaml apps/api/db/drizzle-generated/*.sql apps/api/db/drizzle-generated/meta/*.json)
          if [ ${#files[@]} -lt 3 ]; then
            echo 'Expected pnpm lockfile, generated SQL and snapshot metadata' >&2
            exit 1
          fi
          for path in "${files[@]}"; do
            echo "PANOKIT_FILE_START:${path}"
            base64 -w0 "${path}" | fold -w 768
            echo 'PANOKIT_FILE_END'
          done
